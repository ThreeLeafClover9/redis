spring:
  profiles:
    default: local
  datasource:
    url: jdbc:mariadb://localhost:3306/redis
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.springframework.cache: trace

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mariadb://{RDS_ENDPOINT}:3306/redis
    username: root
    password: 1234
